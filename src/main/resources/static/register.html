<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | CineBook</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="index.html">🎬 Cine<span>Book</span></a><h1>Create your account</h1><p class="auth-subtitle">Register once and book your favourite movies.</p>
<form id="registerForm"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" required><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="120" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><p class="auth-hint">Use at least 8 characters.</p><p class="auth-message" id="authMessage" role="alert"></p><button class="auth-submit" type="submit">Create account</button></form>
<p class="auth-switch">Already have an account? <a id="loginLink" href="login.html">Login</a></p><a class="auth-back" href="index.html">← Back to movies</a></main><script src="auth.js"></script></body></html>
