<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | CineBook</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="index.html">🎬 Cine<span>Book</span></a><h1>Welcome back</h1><p class="auth-subtitle">Log in to continue your movie booking.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p class="auth-message" id="authMessage" role="alert"></p><button class="auth-submit" type="submit">Login</button></form>
<p class="auth-switch">New to CineBook? <a id="registerLink" href="register.html">Create an account</a></p><a class="auth-back" href="index.html">← Back to movies</a></main><script src="auth.js"></script></body></html>
